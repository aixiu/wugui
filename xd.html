            position: relative;
        }

            filter: brightness(1.1);
        }

        .talent-points {
            font-size: 12px;
            font-weight: bold;
        }

        .tree-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }

        .arrow-line {
            position: absolute;
            background-repeat: no-repeat;
            background-size: contain;
            pointer-events: none;
            z-index: 5;
        }

        .grid-cols-4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1.5rem;
            position: relative;
        }

        .talent-slot {
            display: flex;
            justify-content: center;
            position: relative;
        }

        .talent-btn {
            user-select: none;

            },
            resto: {

                ]
            }
        };

        // 状态管理
        let points = {
            balance: new Array(talents.balance.talents.length).fill(0),
            feral: new Array(talents.feral.talents.length).fill(0),
            resto: new Array(talents.resto.talents.length).fill(0)
        };

        // 计算每系总点数
        function getTreeTotal(tree) {
            return points[tree].reduce((a, b) => a + b, 0);
        }

        // 计算剩余总点数
        function getRemainingPoints() {
            let totalUsed = getTreeTotal('balance') + getTreeTotal('feral') + getTreeTotal('resto');
            return 51 - totalUsed;
        }

        // 检查天赋是否可以加点
        function canAddPoint(tree, idx) {
            let t = talents[tree].talents[idx];
            if (points[tree][idx] >= t.ranks) return false;
            let remaining = getRemainingPoints();
            if (remaining <= 0) return false;

            // 检查前置天赋
            if (t.requires !== null && t.requires !== undefined) {
                if (points[tree][t.requires] < t.reqRanks) return false;
            }

            // 检查行内前置点数（需要该行之前有5点）
            let totalInTree = getTreeTotal(tree);
            if (totalInTree < t.row * 5) return false;

            return true;
        }

        // 减点检查
        function canRemovePoint(tree, idx) {
            if (points[tree][idx] <= 0) return false;
            // 检查是否有后续天赋依赖
            for (let i = 0; i < talents[tree].talents.length; i++) {
                let t = talents[tree].talents[i];
                if (t.requires === idx && points[tree][i] > 0) return false;
            }
            return true;
        }

        // 添加箭头连线
        function addArrows(containerId, treeName) {
            const arrows = [
                // 向下的箭头 (row, col) -> (row+1, col)
                { from: [0, 0], to: [1, 0], dir: "down" },
                { from: [0, 1], to: [1, 1], dir: "down" },
                { from: [0, 2], to: [1, 2], dir: "down" },
                { from: [0, 3], to: [1, 3], dir: "down" },
                { from: [1, 0], to: [2, 0], dir: "down" },
                { from: [1, 1], to: [2, 1], dir: "down" },
                { from: [1, 2], to: [2, 2], dir: "down" },
                { from: [1, 3], to: [2, 3], dir: "down" },
                { from: [2, 0], to: [3, 0], dir: "down" },
                { from: [2, 1], to: [3, 1], dir: "down" },
                { from: [2, 2], to: [3, 2], dir: "down" },
                { from: [2, 3], to: [3, 3], dir: "down" },
                { from: [3, 0], to: [4, 0], dir: "down" },
                { from: [3, 1], to: [4, 1], dir: "down" },
                { from: [3, 2], to: [4, 2], dir: "down" },
                { from: [3, 3], to: [4, 3], dir: "down" },
                { from: [4, 0], to: [5, 0], dir: "down" },
                { from: [4, 1], to: [5, 1], dir: "down" },
                { from: [4, 2], to: [5, 2], dir: "down" },
                { from: [4, 3], to: [5, 3], dir: "down" },
                { from: [5, 0], to: [6, 0], dir: "down" },
                { from: [5, 1], to: [6, 1], dir: "down" },
                { from: [5, 2], to: [6, 2], dir: "down" },
                { from: [5, 3], to: [6, 3], dir: "down" },
                // 向右的箭头
                { from: [0, 0], to: [0, 1], dir: "right" },
                { from: [0, 1], to: [0, 2], dir: "right" },
                { from: [0, 2], to: [0, 3], dir: "right" },
                { from: [1, 0], to: [1, 1], dir: "right" },
                { from: [1, 1], to: [1, 2], dir: "right" },
                { from: [1, 2], to: [1, 3], dir: "right" },
                { from: [2, 0], to: [2, 1], dir: "right" },
                { from: [2, 1], to: [2, 2], dir: "right" },
                { from: [2, 2], to: [2, 3], dir: "right" },
                { from: [3, 0], to: [3, 1], dir: "right" },
                { from: [3, 1], to: [3, 2], dir: "right" },
                { from: [3, 2], to: [3, 3], dir: "right" },
                // 向左的箭头
                { from: [0, 1], to: [0, 0], dir: "left" },
                { from: [0, 2], to: [0, 1], dir: "left" },
                { from: [0, 3], to: [0, 2], dir: "left" },
                { from: [1, 1], to: [1, 0], dir: "left" },
                { from: [1, 2], to: [1, 1], dir: "left" },
                { from: [1, 3], to: [1, 2], dir: "left" }
            ];

            const container = document.getElementById(containerId);
            if (!container) return;

            arrows.forEach(arrow => {
                let fromRow = arrow.from[0];
                let fromCol = arrow.from[1];
                let toRow = arrow.to[0];
                let toCol = arrow.to[1];
                let dir = arrow.dir;

                // 获取源和目标位置
                let fromSlot = container.querySelector(`.talent-slot[data-row="${fromRow}"][data-col="${fromCol}"]`);
                let toSlot = container.querySelector(`.talent-slot[data-row="${toRow}"][data-col="${toCol}"]`);

                if (fromSlot && toSlot) {
                    let fromRect = fromSlot.getBoundingClientRect();
                    let toRect = toSlot.getBoundingClientRect();
                    let containerRect = container.getBoundingClientRect();

                    let arrowDiv = document.createElement('div');
                    arrowDiv.className = 'arrow-line';

                    if (dir === 'down') {
                        let left = fromRect.left - containerRect.left + 32;
                        let top = fromRect.bottom - containerRect.top;
                        arrowDiv.style.left = left + 'px';
                        arrowDiv.style.top = top + 'px';
                        arrowDiv.style.width = '15px';
                        arrowDiv.style.height = (toRect.top - fromRect.bottom) + 'px';
                        arrowDiv.style.backgroundImage = 'url("arrows/down.png")';
                        arrowDiv.style.backgroundRepeat = 'repeat-y';
                        arrowDiv.style.backgroundPosition = 'center';
                    } else if (dir === 'right') {
                        let left = fromRect.right - containerRect.left;
                        let top = fromRect.top - containerRect.top + 26;
                        arrowDiv.style.left = left + 'px';
                        arrowDiv.style.top = top + 'px';
                        arrowDiv.style.width = (toRect.left - fromRect.right) + 'px';
                        arrowDiv.style.height = '15px';
                        arrowDiv.style.backgroundImage = 'url("arrows/right.png")';
                        arrowDiv.style.backgroundRepeat = 'repeat-x';
                        arrowDiv.style.backgroundPosition = 'center';
                    } else if (dir === 'left') {
                        let left = toRect.right - containerRect.left;
                        let top = fromRect.top - containerRect.top + 26;
                        arrowDiv.style.left = left + 'px';
                        arrowDiv.style.top = top + 'px';
                        arrowDiv.style.width = (fromRect.left - toRect.right) + 'px';
                        arrowDiv.style.height = '15px';
                        arrowDiv.style.backgroundImage = 'url("arrows/left.png")';
                        arrowDiv.style.backgroundRepeat = 'repeat-x';
                        arrowDiv.style.backgroundPosition = 'center';
                    }

                    container.style.position = 'relative';
                    container.appendChild(arrowDiv);
                }
            });
        }

        // 生成天赋树HTML
        function buildTree(treeName) {
            let tree = talents[treeName];
            let containerId = `${treeName}Tree`;
            let container = document.getElementById(containerId);
            if (!container) return;

            container.innerHTML = '';
            // 确定最大行数
            let maxRow = Math.max(...tree.talents.map(t => t.row));

            // 为每一行创建网格
            for (let row = 0; row <= maxRow; row++) {
                for (let col = 0; col < 4; col++) {
                    let talent = tree.talents.find(t => t.row === row && t.col === col);
                    let slotDiv = document.createElement('div');
                    slotDiv.className = 'talent-slot flex justify-center items-center';
                    slotDiv.setAttribute('data-row', row);
                    slotDiv.setAttribute('data-col', col);

                    if (talent) {
                        let btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'cursor group/icon relative flex-shrink-0 focus:outline-none talent-btn';
                        btn.style.width = '64px';
                        btn.style.height = '64px';
                        btn.setAttribute('data-idx', talent.id);

                        let img = document.createElement('img');
                        img.src = `icons/${talent.icon}.png`;
                        img.width = 64;
                        img.height = 64;
                        img.alt = talent.name;

                        let hoverImg = document.createElement('img');
                        hoverImg.src = 'icon_hover.png';
                        hoverImg.width = 64;
                        hoverImg.height = 64;
                        hoverImg.className = 'absolute inset-0 p-[5%] group-hover/icon:block hidden';

                        let pointsSpan = document.createElement('p');
                        pointsSpan.className = 'bg-dark-gray absolute right-1 bottom-1 translate-x-1/2 translate-y-1/2 rounded border-0 px-1 text-green talent-points';
                        pointsSpan.innerText = `0/${talent.ranks}`;

                        btn.appendChild(img);
                        btn.appendChild(hoverImg);
                        btn.appendChild(pointsSpan);
                        slotDiv.appendChild(btn);
                    } else {
                        // 空白占位
                        let placeholder = document.createElement('div');
                        placeholder.style.width = '64px';
                        placeholder.style.height = '64px';
                        slotDiv.appendChild(placeholder);
                    }
                    container.appendChild(slotDiv);
                }
            }

            // 添加箭头连线
            setTimeout(() => addArrows(containerId, treeName), 100);
        }

        // 更新UI
        function updateUI() {
            // 更新各系总数
            document.getElementById('balanceTotal').innerText = getTreeTotal('balance');
            document.getElementById('feralTotal').innerText = getTreeTotal('feral');
            document.getElementById('restoTotal').innerText = getTreeTotal('resto');
            document.getElementById('totalPointsDisplay').innerHTML = `${getTreeTotal('balance')} / ${getTreeTotal('feral')} / ${getTreeTotal('resto')}`;
            document.getElementById('pointsLeft').innerText = getRemainingPoints();

            // 更新所有天赋按钮状态
            ['balance', 'feral', 'resto'].forEach(tree => {
                let container = document.getElementById(`${tree}Tree`);
                if (!container) return;
                let slots = container.querySelectorAll('.talent-slot');
                slots.forEach((slot, slotIdx) => {
                    let btn = slot.querySelector('.talent-btn');
                    if (!btn) return;
                    let idx = parseInt(btn.getAttribute('data-idx'));
                    if (isNaN(idx)) return;

                    let t = talents[tree].talents[idx];
                    let currentPoints = points[tree][idx];
                    let canAdd = canAddPoint(tree, idx);
                    let canRemove = canRemovePoint(tree, idx);

                    if (!canAdd && currentPoints === 0) {
                        btn.classList.add('grayscale');
                    } else {
                        btn.classList.remove('grayscale');
                    }

                    let pointsSpan = btn.querySelector('.talent-points');
                    if (pointsSpan) pointsSpan.innerText = `${currentPoints}/${t.ranks}`;

                    // 左键加点
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        if (canAdd) {
                            points[tree][idx]++;
                            updateUI();
                        }
                        return false;
                    };

                    // 右键减点
                    btn.oncontextmenu = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if (canRemove) {
                            points[tree][idx]--;
                            updateUI();
                        }
                        return false;
                    };
                });
            });
        }

        // 初始化
        function init() {
            buildTree('balance');
            buildTree('feral');
            buildTree('resto');
            updateUI();

            // 清除按钮事件
            document.querySelectorAll('.clear-tree-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let tree = btn.getAttribute('data-tree');
                    points[tree].fill(0);
                    updateUI();
                });
            });

            // 分享按钮
            document.getElementById('shareBtn').addEventListener('click', () => {
                let url = new URL(window.location.href);
                url.searchParams.set('b', points.balance.join(','));
                url.searchParams.set('f', points.feral.join(','));
                url.searchParams.set('r', points.resto.join(','));
                navigator.clipboard.writeText(url.toString());
                alert('Build link copied to clipboard!');
            });

            // 从URL加载
            let params = new URLSearchParams(window.location.search);
            if (params.has('b')) {
                let b = params.get('b').split(',').map(Number);
                if (b.length === points.balance.length) points.balance = b;
            }
            if (params.has('f')) {
                let f = params.get('f').split(',').map(Number);
                if (f.length === points.feral.length) points.feral = f;
            }
            if (params.has('r')) {
                let r = params.get('r').split(',').map(Number);
                if (r.length === points.resto.length) points.resto = r;
            }
            updateUI();
        }

        init();
    </script>
